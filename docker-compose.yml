# Four services, one command: `docker compose up`.
#
# `api` and `worker` are the same image with different commands -- one build, no
# duplicated code. The split exists because polling Notion is a background job,
# not a request: keeping it out of the API process means LLM and Slack calls never
# sit on a user's request path.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itops}
      POSTGRES_DB: ${POSTGRES_DB:-itops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, on an empty data directory.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itops} -d ${POSTGRES_DB:-itops}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://itops:itops@db:5432/itops}
      # The image copies only src/, so the RAG seed docs are bind-mounted below.
      RAG_SEED_DIR: /app/docs/seed
    volumes:
      - ./docs/seed:/app/docs/seed:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://itops:itops@db:5432/itops}
      # Auto-seeds the RAG corpus on boot when empty; needs the seed docs mounted.
      RAG_SEED_DIR: /app/docs/seed
    volumes:
      - ./docs/seed:/app/docs/seed:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "worker"]

  web:
    build:
      context: ./web
      args:
        # Baked in at build time: Next inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
